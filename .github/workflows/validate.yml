name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate skill structure
        run: python3 scripts/validate_skills.py
      - name: Verify desktop packages
        run: python3 scripts/package_skills.py --output /tmp/devvit-skill-packages
